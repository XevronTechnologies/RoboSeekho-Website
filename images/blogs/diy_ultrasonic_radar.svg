<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#22c55e"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- Radar Screen Semicircle (Green phosphor) -->
            <path d="M 200 190 A 120 120 0 0 1 440 190 Z" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
            <path d="M 240 190 A 80 80 0 0 1 400 190 Z" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4"/>
            <path d="M 280 190 A 40 40 0 0 1 360 190 Z" fill="none" stroke="#22c55e" stroke-width="1"/>
            <!-- Angle Grid Lines -->
            <line x1="320" y1="190" x2="320" y2="70" stroke="#16a34a" stroke-width="1"/>
            <line x1="320" y1="190" x2="235" y2="105" stroke="#16a34a" stroke-width="1"/>
            <line x1="320" y1="190" x2="405" y2="105" stroke="#16a34a" stroke-width="1"/>
            <!-- Sweeping Green Radar Ray Cone -->
            <polygon points="320,190 380,85 410,105" fill="url(#radarSweep)" opacity="0.6"/>
            <!-- Blips / Target Objects Detected -->
            <circle cx="360" cy="125" r="5" fill="#ef4444"/>
            <circle cx="360" cy="125" r="10" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2"/>
            <circle cx="270" cy="150" r="4" fill="#ef4444"/>
            <!-- Center Turret Sensor -->
            <circle cx="320" cy="190" r="14" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
            <circle cx="320" cy="190" r="4" fill="#4ade80"/>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">DIY Ultrasonic Radar</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">Arduino Uno + HC-SR04 + Processing GUI</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#22c55e" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>