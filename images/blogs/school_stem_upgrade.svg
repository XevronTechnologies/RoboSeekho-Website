<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <line x1="20" y1="20" x2="80" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <line x1="20" y1="340" x2="80" y2="340" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#f59e0b"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <g id="illustration">
    
            <!-- School / Lab Building & Graduation Cap Icon -->
            <polygon points="260,85 320,55 380,85 320,110" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
            <path d="M 380 85 L 380 110" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
            <circle cx="380" cy="115" r="4" fill="#f59e0b"/>
            <!-- Workbench Table with Lab Gear -->
            <rect x="230" y="140" width="180" height="70" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <!-- 3D Printer on Table -->
            <rect x="245" y="110" width="35" height="30" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
            <line x1="262" y1="110" x2="262" y2="128" stroke="#ef4444" stroke-width="2"/>
            <circle cx="262" cy="130" r="3" fill="#ef4444"/>
            <!-- Robotic Arm on Table -->
            <path d="M 310 140 L 320 115 L 335 125" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
            <!-- Microcontroller board glowing -->
            <rect x="355" y="125" width="28" height="18" rx="2" fill="#00878f" stroke="#22d3ee" stroke-width="1.5"/>
            <!-- Graduation / Innovation Sparkles -->
            <path d="M 240 70 L 243 78 L 251 81 L 243 84 L 240 92 L 237 84 L 229 81 L 237 78 Z" fill="#fef08a"/>
            <path d="M 390 135 L 392 140 L 397 142 L 392 144 L 390 149 L 388 144 L 383 142 L 388 140 Z" fill="#fef08a"/>
        
  </g>

  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">School STEM & Robotics Lab</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">K-12 Innovation Hubs + ATLs + AI Kits</text>
  
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>