<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#3b82f6"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- Robot Chassis -->
            <rect x="250" y="90" width="140" height="85" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
            <!-- Big Wheels on Sides -->
            <rect x="230" y="80" width="22" height="45" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
            <rect x="230" y="140" width="22" height="45" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
            <rect x="388" y="80" width="22" height="45" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
            <rect x="388" y="140" width="22" height="45" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
            <!-- Sensor Turret -->
            <circle cx="320" cy="90" r="12" fill="#0284c7"/>
            <rect x="300" y="60" width="40" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
            <circle cx="310" cy="72" r="7" fill="#38bdf8"/>
            <circle cx="330" cy="72" r="7" fill="#38bdf8"/>
            <!-- Sonar detection beam -->
            <polygon points="320,60 270,15 370,15" fill="url(#sonarBeam)" opacity="0.35"/>
            <circle cx="320" cy="20" r="6" fill="#ef4444"/>
            <!-- Arduino Uno footprint on chassis -->
            <rect x="280" y="115" width="80" height="45" rx="4" fill="#00878f" stroke="#22d3ee" stroke-width="1.5"/>
            <text x="320" y="142" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle" font-family="monospace">ARDUINO</text>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">Obstacle Avoiding Robot</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">2WD Smart Chassis + HC-SR04 + L298N</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#3b82f6" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>