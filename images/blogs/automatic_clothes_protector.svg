<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#06b6d4"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- Rain Clouds & Raindrops -->
            <path d="M 230 65 A 16 16 0 0 1 255 55 A 24 24 0 0 1 295 55 A 18 18 0 0 1 315 70 Z" fill="#64748b"/>
            <!-- Droplets falling -->
            <line x1="250" y1="80" x2="245" y2="95" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="275" y1="85" x2="270" y2="100" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="300" y1="80" x2="295" y2="95" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Rain Sensor PCB Board -->
            <rect x="235" y="115" width="50" height="35" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
            <path d="M 240 123 H 280 M 240 130 H 280 M 240 137 H 280" stroke="#facc15" stroke-width="2"/>
            <!-- Clothesline Pulley & Protective Roof -->
            <polygon points="320,80 420,80 435,110 305,110" fill="#dc2626" opacity="0.85"/>
            <line x1="320" y1="130" x2="420" y2="130" stroke="#e2e8f0" stroke-width="2"/>
            <!-- Shirt on hanger -->
            <path d="M 370 130 L 355 145 L 362 175 L 378 175 L 385 145 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
            <!-- Motor pulley arrow -->
            <circle cx="420" cy="130" r="10" fill="#475569"/>
            <path d="M 400 120 L 385 120" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">Rain Clothes Protector</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">Rain Drop Sensor + DC Gear Motor + Shelter</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#06b6d4" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>