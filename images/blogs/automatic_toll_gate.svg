<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#6366f1"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- Toll Booth Cabin -->
            <rect x="230" y="80" width="65" height="110" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
            <rect x="240" y="90" width="45" height="35" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
            <!-- RFID Card Scanner Module -->
            <rect x="240" y="140" width="45" height="30" rx="3" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
            <circle cx="262" cy="155" r="6" fill="#818cf8"/>
            <!-- RFID Radio waves -->
            <path d="M 295 145 A 14 14 0 0 1 295 165" fill="none" stroke="#818cf8" stroke-width="2"/>
            <path d="M 305 138 A 24 24 0 0 1 305 172" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3"/>
            <!-- Boom Barrier Gate Post & Arm -->
            <rect x="340" y="120" width="20" height="70" rx="3" fill="#475569"/>
            <circle cx="350" cy="130" r="7" fill="#f8fafc"/>
            <!-- Red/White Striped Barrier Arm lifted open -->
            <line x1="350" y1="130" x2="420" y2="80" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
            <line x1="365" y1="119" x2="375" y2="112" stroke="#ffffff" stroke-width="6"/>
            <line x1="390" y1="101" x2="400" y2="94" stroke="#ffffff" stroke-width="6"/>
            <!-- Traffic Light Green -->
            <rect x="343" y="70" width="14" height="32" rx="3" fill="#0f172a"/>
            <circle cx="350" cy="78" r="4" fill="#334155"/>
            <circle cx="350" cy="94" r="4" fill="#22c55e"/>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">Smart RFID Toll Gate</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">RC522 RFID + Arduino Uno + Servo Barrier</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#6366f1" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>