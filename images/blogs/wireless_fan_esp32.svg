<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#0284c7"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- Fan Frame Outer Circle -->
            <circle cx="280" cy="135" r="60" fill="#0f172a" stroke="#0284c7" stroke-width="3"/>
            <circle cx="280" cy="135" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
            <!-- Fan Blades with rotational curves -->
            <path d="M 280 119 Q 295 90 280 75 Q 265 90 280 119" fill="#0284c7" opacity="0.9"/>
            <path d="M 296 135 Q 325 150 340 135 Q 325 120 296 135" fill="#0284c7" opacity="0.9"/>
            <path d="M 280 151 Q 265 180 280 195 Q 295 180 280 151" fill="#0284c7" opacity="0.9"/>
            <path d="M 264 135 Q 235 120 220 135 Q 235 150 264 135" fill="#0284c7" opacity="0.9"/>
            <!-- ESP32 Controller Board -->
            <rect x="365" y="90" width="75" height="95" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
            <rect x="380" y="100" width="45" height="40" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
            <!-- Antenna trace -->
            <path d="M 380 93 L 425 93 L 425 97 L 385 97" stroke="#eab308" stroke-width="2" fill="none"/>
            <!-- Wi-Fi Broadcast Waves -->
            <path d="M 402 75 A 15 15 0 0 1 422 75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
            <path d="M 395 65 A 25 25 0 0 1 430 65" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">Wireless ESP32 Fan Control</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">ESP32 Wi-Fi / BLE + Step-less PWM + DHT11</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>