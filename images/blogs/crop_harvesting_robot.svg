<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <line x1="20" y1="20" x2="80" y2="20" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <line x1="20" y1="340" x2="80" y2="340" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#10b981"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <g id="illustration">
    
            <!-- Plant Stem and Leaves -->
            <path d="M 230 210 Q 240 130 260 100" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
            <path d="M 245 150 Q 220 135 210 145 Q 225 165 245 155" fill="#16a34a"/>
            <path d="M 252 120 Q 280 110 285 125 Q 265 140 252 125" fill="#16a34a"/>
            <!-- Ripe Red Fruit / Apple -->
            <circle cx="265" cy="95" r="18" fill="#ef4444"/>
            <circle cx="260" cy="90" r="4" fill="#fca5a5"/>
            <!-- Harvesting Robotic Arm Gripper (Cyan/Blue) -->
            <rect x="360" y="150" width="60" height="24" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
            <line x1="360" y1="162" x2="310" y2="120" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
            <line x1="310" y1="120" x2="288" y2="105" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
            <!-- Dual Soft Gripper Claws surrounding the fruit -->
            <path d="M 288 105 Q 275 80 260 80" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <path d="M 288 105 Q 275 115 260 115" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
            <!-- Optical Sensor / Camera Beam -->
            <polygon points="310,120 250,75 250,125" fill="#10b981" opacity="0.25"/>
            <!-- Wheels on Agri-Rover Chassis -->
            <rect x="350" y="174" width="22" height="40" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
            <rect x="410" y="174" width="22" height="40" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
        
  </g>

  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">Crop Harvesting Robot</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">Robotic Gripper + Color Sensor + Agri Rover</text>
  
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>