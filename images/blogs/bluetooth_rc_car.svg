<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#3b82f6"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- Smartphone Display with Joystick -->
            <rect x="210" y="80" width="65" height="110" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
            <circle cx="242" cy="130" r="18" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
            <circle cx="242" cy="125" r="8" fill="#38bdf8"/>
            <!-- Bluetooth waves between Phone & Car -->
            <path d="M 285 125 Q 300 115 315 125" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
            <path d="M 288 115 Q 300 105 312 115" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3"/>
            <!-- 4WD Bluetooth Rover -->
            <rect x="330" y="90" width="90" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
            <!-- 4 Wheels -->
            <rect x="318" y="95" width="12" height="30" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
            <rect x="318" y="135" width="12" height="30" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
            <rect x="420" y="95" width="12" height="30" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
            <rect x="420" y="135" width="12" height="30" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
            <!-- HC-05 Module LED blinks -->
            <rect x="360" y="105" width="30" height="20" rx="2" fill="#0284c7"/>
            <circle cx="366" cy="115" r="2.5" fill="#ef4444"/>
            <circle cx="374" cy="115" r="2.5" fill="#22c55e"/>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">Bluetooth Smartphone Car</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">HC-05 Bluetooth + Arduino Uno + 4WD App</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#3b82f6" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>