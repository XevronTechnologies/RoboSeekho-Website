<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#f59e0b"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- Hopper Tank (Funnel) -->
            <polygon points="260,60 360,60 335,140 285,140" fill="#334155" stroke="#f59e0b" stroke-width="2.5"/>
            <!-- Food Kibbles inside tank -->
            <circle cx="295" cy="85" r="4" fill="#d97706"/>
            <circle cx="315" cy="80" r="4" fill="#d97706"/>
            <circle cx="325" cy="95" r="4" fill="#d97706"/>
            <circle cx="305" cy="105" r="4" fill="#d97706"/>
            <circle cx="310" cy="125" r="4" fill="#d97706"/>
            <!-- Dispenser Chute / Rotating Valve -->
            <rect x="285" y="140" width="50" height="25" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <circle cx="310" cy="152" r="7" fill="#0284c7"/>
            <!-- Food falling into pet bowl -->
            <circle cx="310" cy="175" r="3.5" fill="#f59e0b"/>
            <circle cx="312" cy="188" r="3.5" fill="#f59e0b"/>
            <!-- Pet Bowl -->
            <ellipse cx="310" cy="205" rx="45" ry="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
            <ellipse cx="310" cy="203" rx="35" ry="9" fill="#b45309"/>
            <!-- Clock icon (RTC) -->
            <circle cx="390" cy="80" r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
            <line x1="390" y1="80" x2="390" y2="70" stroke="#22d3ee" stroke-width="2"/>
            <line x1="390" y1="80" x2="398" y2="80" stroke="#22d3ee" stroke-width="2"/>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">Automatic Pet Feeder</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">Arduino Uno + DS3231 RTC + Servo Dispenser</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>