<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#f59e0b"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- The Box -->
            <polygon points="250,110 350,80 430,120 330,150" fill="#451a03" stroke="#b45309" stroke-width="2"/>
            <polygon points="250,110 330,150 330,210 250,170" fill="#78350f" stroke="#b45309" stroke-width="2"/>
            <polygon points="330,150 430,120 430,180 330,210" fill="#92400e" stroke="#b45309" stroke-width="2"/>
            <!-- Hatch Open -->
            <polygon points="330,150 410,100 420,110 340,160" fill="#b45309" stroke="#d97706" stroke-width="2"/>
            <!-- Servo Finger Pushing Out -->
            <path d="M 370 130 Q 380 90 350 70" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round"/>
            <circle cx="350" cy="70" r="5" fill="#f8fafc"/>
            <!-- Flashlight / Sun rays shining down -->
            <circle cx="270" cy="60" r="16" fill="#fef08a" opacity="0.8"/>
            <line x1="270" y1="40" x2="270" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
            <line x1="290" y1="60" x2="300" y2="60" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
            <line x1="285" y1="75" x2="320" y2="100" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4"/>
            <!-- LDR on box -->
            <rect x="315" y="125" width="16" height="10" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
            <path d="M 318 130 Q 323 127 328 130" stroke="#ef4444" stroke-width="2" fill="none"/>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">Light-Averse Useless Servo</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">LDR Photoresistor + SG90 Servo + Arduino</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>