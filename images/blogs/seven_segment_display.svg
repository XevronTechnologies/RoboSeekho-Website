<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="sonarBeam" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pirGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bgGrad)"/>
  <rect width="640" height="360" fill="url(#gridPattern)"/>

  <!-- Tech Accent Lines & Corner Borders -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="20" y2="80" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="560" y2="20" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="20" x2="620" y2="80" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="20" y1="340" x2="80" y2="340" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="340" x2="20" y2="280" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="560" y2="340" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  <line x1="620" y1="340" x2="620" y2="280" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>

  <!-- Top RoboSeekho Brand Pill -->
  <rect x="36" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="4" fill="#f43f5e"/>
  <text x="58" y="48" font-size="11" font-weight="700" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" letter-spacing="1">ROBOSEEKHO</text>

  <!-- Top Right Lab Tag -->
  <rect x="500" y="32" width="104" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="552" y="48" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle" font-family="'Space Grotesk', sans-serif">MAKER BUILD</text>

  <!-- Illustration Visual Center -->
  <g id="illustration">
    
            <!-- 7 Segment Module Frame -->
            <rect x="260" y="60" width="120" height="150" rx="10" fill="#09090b" stroke="#f43f5e" stroke-width="3"/>
            <!-- Red Glowing Segments (forming number 8 or 9) -->
            <!-- Top a -->
            <polygon points="285,75 355,75 348,83 292,83" fill="#f43f5e"/>
            <!-- Top Right b -->
            <polygon points="357,78 357,128 349,122 349,85" fill="#f43f5e"/>
            <!-- Bottom Right c -->
            <polygon points="357,136 357,186 349,180 349,142" fill="#f43f5e"/>
            <!-- Bottom d -->
            <polygon points="285,189 355,189 348,181 292,181" fill="#f43f5e"/>
            <!-- Bottom Left e -->
            <polygon points="283,136 283,186 291,180 291,142" fill="#f43f5e" opacity="0.25"/>
            <!-- Top Left f -->
            <polygon points="283,78 283,128 291,122 291,85" fill="#f43f5e"/>
            <!-- Middle g -->
            <polygon points="292,132 348,132 354,136 348,140 292,140 286,136" fill="#f43f5e"/>
            <!-- Decimal Point DP -->
            <circle cx="366" cy="188" r="4" fill="#f43f5e"/>
            <!-- Breadboard wires -->
            <path d="M 240 100 L 260 100" stroke="#38bdf8" stroke-width="3"/>
            <path d="M 240 135 L 260 135" stroke="#4ade80" stroke-width="3"/>
            <path d="M 240 170 L 260 170" stroke="#facc15" stroke-width="3"/>
            <path d="M 380 135 L 400 135" stroke="#ef4444" stroke-width="3"/>
        
  </g>

  <!-- Bottom Title Card Bar -->
  <rect x="36" y="270" width="568" height="60" rx="8" fill="#0b1120" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
  <line x1="36" y1="270" x2="160" y2="270" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  
  <text x="56" y="297" font-size="19" font-weight="800" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif">7-Segment Display Counter</text>
  <text x="56" y="318" font-size="12" font-weight="500" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif">Arduino Uno + BCD Decoder + 0-9 Counter</text>
  
  <!-- Right Badge -->
  <rect x="510" y="285" width="76" height="28" rx="14" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="548" y="303" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle" font-family="'Space Grotesk', sans-serif">VERIFIED</text>
</svg>